name: Publish Dart Packages

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  analyze-and-publish:
    name: Analyze and Publish Dart Packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check if CHANGELOG is updated
        id: changes
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q '^CHANGELOG.md$'; then
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Analyze universal_ffi
        if: env.skip != 'true'
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Publish universal_ffi (if valid)
        if: env.skip != 'true'
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          # Validate the package
          dart pub publish --dry-run

          # Publish the package if validation succeeds
          echo "Publishing universal_ffi to pub.dev..."
          # dart pub publish --force
